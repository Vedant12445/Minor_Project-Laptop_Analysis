<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Rating Distribution</title>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <link rel="stylesheet" href="static/css/ratingsStyle.css">

</head>
<body>
  <div class="main-content">
    <h1>Rating Distribution</h1>

    <label>
      Category:
      <select id="categorySelect">
        {% for c in categories %}
        <option value="{{ c }}">{{ c|capitalize }}</option>
        {% endfor %}
      </select>
    </label>

    <label>
      Chart Type:
      <select id="chartTypeSelect">
        <option value="bar">Bar</option>
        <option value="line">Line</option>
      </select>
    </label>

    <div class="chart-container">
      <canvas id="chartRatingDist"></canvas>
    </div>
  </div>

  <script>
    const catEl = document.getElementById('categorySelect');
    const typeEl = document.getElementById('chartTypeSelect');
    const chartEl = document.getElementById('chartRatingDist');
    let chart;

    async function draw() {
      const cat = catEl.value;
      const type = typeEl.value;
      const dist = await fetch(`/api/rating-dist/${cat}`).then(res => res.json());

      if (chart) chart.destroy();

      chart = new Chart(chartEl, {
        type: type,
        data: {
          labels: dist.ranges,
          datasets: [{
            label: 'Number of Products',
            data: dist.counts,
            backgroundColor: '#E07A5F',
            borderColor: '#b8553f',
            borderWidth: 1
          }]
        },
        options: {
          responsive: true,
          maintainAspectRatio: false,
          plugins: {
            legend: {
              display: false
            }
          },
          scales: {
            y: {
              beginAtZero: true
            }
          }
        }
      });
    }

    catEl.addEventListener('change', draw);
    typeEl.addEventListener('change', draw);
    window.onload = draw;
  </script>
</body>
</html>
